[package]
name = "mictlan"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/mictlan"
homepage = "https://github.com/savageAZfck/mictlan"
license = "MIT"
description = "Posthumous agency for sovereign organisms: owner-signed standing orders that execute only after a cryptographically-proven death — every posthumous act in scope, on chain, and bounded — named for Mictlan, the Aztec land of the dead"
keywords = ["dead-man", "succession", "will", "sovereignty", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
